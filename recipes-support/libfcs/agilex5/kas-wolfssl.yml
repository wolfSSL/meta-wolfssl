header:
  version: 17

repos:
  meta-wolfssl:
    path: meta-wolfssl
    layers:
      .:

local_conf_header:
  wolfssl-altera-fcs: |
    WOLFSSL_ALTERA_FCS = "1"
    WOLFSSL_FCS_PROVIDER = "gsrd-intel-fcs-lib"
    IMAGE_INSTALL:append = " wolfssl wolfcrypttest wolfcryptbenchmark"
    # Use the matching wolfSSL Agilex 5 port until that change is merged.
    SRC_URI:pn-wolfssl = "git://github.com/aidangarske/wolfssl.git;protocol=https;branch=agilex5-fcs-port"
    SRCREV:pn-wolfssl = "7fd8b49653b5186f82b21a0ed9f6ccd7b03bdd53"
